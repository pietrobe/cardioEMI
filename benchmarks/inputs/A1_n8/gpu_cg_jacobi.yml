# Generated by benchmarks/make_inputs.py -- do not edit by hand
mesh_file             : "meshes/A1.xdmf"
tags_dictionary_file  : "meshes/A1.pickle"
mesh_conversion_factor: 0.0001   # um -> cm
ECS_TAG  : 0
fem_order: 1
cuda     : True

# Temporal parameters
dt         : 0.005
time_steps : 100

# Physical parameters
C_M    : 1
sigma_i: 5
sigma_e: 1
R_g    : 0.003

# Boundary conditions (0 = pure Neumann + constant nullspace)
Dirichlet_points: 0

# Initial membrane potential
v_init: "-80 * (x[0] > 0.0)"

# Ionic model
ionic_model:
  intra_intra: "Passive"
  intra_extra: "AP"

# Solver
ksp_type: "cg"
pc_type : "jacobi"
ksp_rtol: 1.0e-7
petsc_opts:
  ksp_max_it: 30000

# Output
save_output     : False
save_performance: True
verbose         : False
out_name        : "results/A1_n8/gpu_cg_jacobi"
